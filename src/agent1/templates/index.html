<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kanban Board</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <header class="topbar">
    <h1 class="brand">Kanban</h1>
    <input
      id="search"
      class="search"
      type="search"
      placeholder="Search cards by title, text or tag…"
      autocomplete="off"
      aria-label="Search cards"
    />
    <button id="add-frame" class="btn btn-primary" type="button">+ Add Frame</button>
    <button class="icon-btn sfx-toggle" type="button" aria-label="Mute drag sounds">🔇</button>
  </header>

  <div id="sfx-prompt" class="sfx-prompt" hidden>
    <span>🎵 Drag sounds are off. Click to enable.</span>
  </div>

  <main id="board" class="board" aria-label="Kanban board"></main>

  <!-- Card editor dialog -->
  <div id="card-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="card-modal-title">
    <div class="modal-backdrop" data-close></div>
    <form id="card-form" class="modal-card">
      <h2 id="card-modal-title">Edit card</h2>
      <label>
        Title
        <input id="card-title" name="title" type="text" maxlength="200" required />
      </label>
      <label>
        Description
        <textarea id="card-text" name="text" maxlength="2000" rows="4"></textarea>
      </label>
      <label>
        Tags (comma separated)
        <input id="card-tags" name="tags" type="text" />
      </label>
      <div class="modal-actions">
        <button type="button" class="btn" data-close>Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>

  <template id="frame-template">
    <section class="frame" draggable="false">
      <header class="frame-header">
        <input class="frame-title" type="text" maxlength="100" />
        <div class="frame-tools">
          <button class="icon-btn frame-add" title="Add card" type="button">+</button>
          <button class="icon-btn frame-del" title="Delete frame" type="button">×</button>
        </div>
      </header>
      <div class="cards" role="list"></div>
    </section>
  </template>

  <template id="card-template">
    <article class="card" draggable="true" role="listitem">
      <div class="card-title"></div>
      <p class="card-text"></p>
      <div class="card-tags"></div>
      <div class="card-tools">
        <button class="icon-btn card-edit" title="Edit" type="button">✎</button>
        <button class="icon-btn card-del" title="Delete" type="button">×</button>
      </div>
    </article>
  </template>

  <script src="{{ url_for('static', filename='dnd.js') }}" defer></script>
  <script src="{{ url_for('static', filename='main.js') }}" defer></script>
</body>
</html>
