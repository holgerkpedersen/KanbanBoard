<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kanban Board</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <script nonce="{{ theme_nonce }}">
    // Apply the saved theme before first paint to avoid a flash of the
    // default theme. Allowed by the strict CSP via the per-request nonce.
    (function () {
      var t = localStorage.getItem("kanban.theme") || "dark";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <header class="topbar">
    <h1 class="brand">Kanban</h1>
    <button id="board-switcher" class="btn board-switcher" type="button" aria-haspopup="dialog" aria-controls="board-modal">
      <span class="board-switcher-label">📋 <span id="board-name">…</span></span>
      <span aria-hidden="true" class="board-switcher-caret">▾</span>
    </button>
    <input
      id="search"
      class="search"
      type="search"
      placeholder="Search cards by title, text or tag…"
      autocomplete="off"
      aria-label="Search cards"
    />
    <button id="add-frame" class="btn btn-primary" type="button">+ Add Frame</button>
    <label class="theme-picker">
      <span class="visually-hidden">Theme</span>
      <select id="theme-select" aria-label="Theme">
        <option value="dark">Dark</option>
        <option value="light">Light</option>
        <option value="contrast">Contrast</option>
        <option value="contrast-dark">Contrast Dark</option>
      </select>
    </label>
    <button class="icon-btn sfx-toggle" type="button" aria-label="Mute drag sounds">🔇</button>
  </header>

  <div id="sfx-prompt" class="sfx-prompt" hidden>
    <span>🎵 Drag sounds are off. Click to enable.</span>
  </div>

  <main id="board" class="board" aria-label="Kanban board"></main>

  <!-- Card editor dialog -->
  <div id="card-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="card-modal-title">
    <div class="modal-backdrop" data-close></div>
    <form id="card-form" class="modal-card">
      <h2 id="card-modal-title">Edit card</h2>
      <label>
        Title
        <input id="card-title" name="title" type="text" maxlength="200" required />
      </label>
      <label>
        Description
        <textarea id="card-text" name="text" maxlength="2000" rows="4"></textarea>
      </label>
      <label>
        Tags (comma separated)
        <input id="card-tags" name="tags" type="text" />
      </label>
      <label>
        System
        <input id="card-system" name="system" type="text" maxlength="60" list="system-list" placeholder="e.g. Billing, Auth, API" />
        <datalist id="system-list"></datalist>
      </label>
      <div class="modal-actions">
        <button type="button" class="btn" data-close>Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>

  <template id="frame-template">
    <section class="frame" draggable="false">
      <header class="frame-header">
        <input class="frame-title" type="text" maxlength="100" />
        <div class="frame-tools">
          <button class="icon-btn frame-add" title="Add card" type="button">+</button>
          <button class="icon-btn frame-del" title="Delete frame" type="button">×</button>
        </div>
      </header>
      <div class="cards" role="list"></div>
    </section>
  </template>

  <template id="card-template">
    <article class="card" draggable="true" role="listitem">
      <div class="card-title"></div>
      <p class="card-text"></p>
      <div class="card-system" hidden></div>
      <div class="card-tags"></div>
      <div class="card-tools">
        <button class="icon-btn card-edit" title="Edit" type="button">✎</button>
        <button class="icon-btn card-del" title="Delete" type="button">×</button>
      </div>
    </article>
  </template>

  <!-- Board manager dialog -->
  <div id="board-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="board-modal-title">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card board-modal-card">
      <h2 id="board-modal-title">Boards</h2>

      <p class="board-picker-help">
        Boards are produced by Agent1 in
        <code id="board-catalog-dir">data/boards</code>. Pick one to open
        it; your edits are saved to
        <code id="board-working-dir">data</code> so the catalog stays
        pristine.
      </p>

      <div class="board-picker-row">
        <label for="board-select" class="board-picker-label">Board</label>
        <select id="board-select" class="board-picker-select" size="6"></select>
      </div>

      <div class="board-upload-row">
        <label for="board-upload-file" class="board-picker-label">Upload board</label>
        <input id="board-upload-file" class="board-upload-input" type="file"
               accept="application/json,.json" />
        <button id="board-upload-submit" type="button" class="btn">Upload</button>
      </div>

      <div class="modal-actions">
        <button id="board-open-submit" type="button" class="btn btn-primary">Open</button>
        <button id="board-reset-submit" type="button" class="btn">Reset</button>
        <button type="button" class="btn" data-close>Close</button>
      </div>

      <p id="board-modal-info" class="board-picker-info" hidden></p>
      <div id="board-modal-error" class="board-picker-error" hidden></div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='dnd.js') }}" defer></script>
  <script src="{{ url_for('static', filename='main.js') }}" defer></script>
</body>
</html>
