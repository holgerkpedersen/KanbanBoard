<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kanban Board — Tree View</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  <style>
    /* Tree-specific overrides — inherits all shared theme variables from style.css */
    :root {
      --child-bg: var(--surface-2);
      --indent: 24px;
      --card-border: var(--border);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
      line-height: 1.5;
    }

    h1 {
      margin-bottom: 8px;
      font-size: 1.6rem;
      color: var(--accent);
    }

    .subtitle {
      color: var(--muted);
      margin-bottom: 24px;
      font-size: 0.9rem;
    }

    a.back-link, a.back-link:hover {
      color: var(--accent);
      text-decoration: none;
      display: inline-block;
      margin-bottom: 16px;
    }
    a.back-link:hover { text-decoration: underline; }

    .frame-section {
      margin-bottom: 32px;
    }

    .frame-title, .tree .frame-title {
      font-size: 1.1rem;
      color: var(--accent);
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
      margin-bottom: 12px;
    }

    /* Tree node */
    .tree ul {
      list-style: none;
      padding-left: var(--indent);
      border-left: 2px solid var(--border);
      margin-left: 8px;
    }

    .tree > ul {
      padding-left: 0;
      border-left: none;
      margin-left: 0;
    }

    .tree li {
      position: relative;
      margin-bottom: 6px;
    }

    /* Parent card */
    .card-parent {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      cursor: pointer;
      user-select: none;
      transition: box-shadow 0.15s;
    }
    .card-parent:hover {
      box-shadow: var(--shadow);
    }

    .card-parent .title {
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toggle-icon {
      display: inline-block;
      width: 18px;
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      transition: transform 0.2s;
    }
    .toggle-icon.expanded {
      transform: rotate(90deg);
    }

    .card-parent .meta,
    .card-child .text-preview,
    .card-child .meta,
    #loading {
      font-size: 0.78rem;
      color: var(--muted);
    }

    /* Child card */
    .card-child {
      background: var(--child-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      margin-top: 4px;
      font-size: 0.9rem;
    }

    .card-child .title {
      color: var(--text);
    }

    .card-child .text-preview {
      margin-top: 3px;
      color: var(--muted);
      font-size: 0.82rem;
      max-height: 3em;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .card-child .meta {
      margin-top: 3px;
      font-size: 0.75rem;
      color: var(--muted);
    }

    /* Tags */
    .tag {
      display: inline-block;
      background: var(--tag-bg, #292e42);
      border-radius: 10px;
      padding: 1px 8px;
      font-size: 0.72rem;
      color: var(--tag-text, var(--accent));
      margin-right: 4px;
      margin-top: 4px;
    }

    /* Status badge */
    .status {
      display: inline-block;
      border-radius: 10px;
      padding: 1px 8px;
      font-size: 0.72rem;
      text-transform: capitalize;
      margin-left: auto;
    }
    .status-open        { background: var(--accent); color: #fff; }
    .status-planned     { background: var(--accent-2, var(--accent)); color: #fff; }
    .status-in-progress { background: #bb9af7; color: #2e2e3e; }
    .status-reviewing   { background: var(--danger); color: #fff; }
    .status-done        { background:  #9ece6a; color: #1a1b26; }

    /* Expand/collapse all */
    .controls {
      margin-bottom: 16px;
    }
    .controls button {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 5px 12px;
      border-radius: 4px;
      cursor: pointer;
      margin-right: 8px;
    }
    .controls button:hover { background: var(--surface-2); }

    /* Loading state */
    #loading {
      text-align: center;
      padding: 60px;
      color: var(--muted);
    }
    #error {
      color: var(--danger);
      background: rgba(255,91,110,0.1);
      border: 1px solid var(--danger);
      padding: 16px;
      border-radius: 8px;
      margin: 24px 0;
      display: none;
    }

    /* Responsive */
    @media (max-width: 600px) {
      body { padding: 12px; }
      .tree ul { border-left-color: transparent; }
      .card-parent, .card-child { padding: 8px 10px; }
    }
  </style>
</head>
<body>
  <a href="/" class="back-link">← Back to board view</a>
  <h1>📂 Tree View</h1>
  <p class="subtitle">Card hierarchy: parent cards with nested child cards, grouped by frame (column). Same cards as the board — search, filter and edit from here.</p>

  <!-- Card filters + search: same controls and matching rules as the board view. -->
  <section id="filter-bar" class="filter-bar" aria-label="Card filters">
    <input
      id="search"
      class="search"
      type="search"
      placeholder="Search cards by title, text, tag or system…"
      autocomplete="off"
      aria-label="Search cards"
    />
    <div class="filter-group" role="group" aria-labelledby="filter-created-label">
      <span id="filter-created-label" class="filter-label">Created</span>
      <input id="filter-created-from" type="date" class="date-input" aria-label="Created from date" />
      <span class="filter-sep" aria-hidden="true">&ndash;</span>
      <input id="filter-created-to" type="date" class="date-input" aria-label="Created to date" />
    </div>
    <div class="filter-group" role="group" aria-labelledby="filter-updated-label">
      <span id="filter-updated-label" class="filter-label">Updated</span>
      <input id="filter-updated-from" type="date" class="date-input" aria-label="Updated from date" />
      <span class="filter-sep" aria-hidden="true">&ndash;</span>
      <input id="filter-updated-to" type="date" class="date-input" aria-label="Updated to date" />
    </div>
    <div id="tag-filter" class="tag-filter" role="group" aria-label="Tag filters"></div>
    <button
      id="filter-integrated"
      class="btn btn-ghost filter-integrated"
      type="button"
      aria-pressed="false"
      title="Show only cards linked to an Agent1 issue"
    >🔗 Integrated</button>
    <button id="show-descriptions" class="btn btn-ghost filter-descriptions active" type="button" aria-pressed="true" title="Toggle card descriptions on the tree">📝 Descriptions</button>
    <button id="clear-filters" class="btn btn-ghost filter-clear" type="button">Clear</button>
  </section>

  <div class="controls" id="controls" hidden>
    <button type="button" onclick="TreeApp.expandAll()">Expand all</button>
    <button type="button" onclick="TreeApp.collapseAll()">Collapse all</button>
    <button id="add-card" class="btn btn-primary" type="button">+ Add Card</button>
  </div>

  <!-- Theme picker (mirrors the one on index.html) -->
  <label class="theme-picker">
    <span class="visually-hidden">Theme</span>
    <select id="theme-select" aria-label="Theme">
      <option value="dark">Dark</option>
      <option value="light">Light</option>
      <option value="contrast">Contrast</option>
      <option value="contrast-dark">Contrast Dark</option>
    </select>
  </label>

  <div id="loading">Loading tree…</div>
  <div id="error"></div>
  <main class="tree" id="tree-root"></main>

  <!-- Card editor dialog: the same fields as the board view's editor, so a
       card edited here lands on the board with identical data. The frame
       select is the tree view's stand-in for drag & drop. -->
  <div id="card-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="card-modal-title">
    <div class="modal-backdrop" data-close></div>
    <form id="card-form" class="modal-card card-modal-card">
      <h2 id="card-modal-title">Edit card</h2>
      <label>
        Title
        <input id="card-title" name="title" type="text" maxlength="200" required />
      </label>
      <label>
        Description
        <textarea id="card-text" name="text" maxlength="2000" rows="8"></textarea>
      </label>
      <label>
        Tags (comma separated)
        <input id="card-tags" name="tags" type="text" />
      </label>
      <label>
        System
        <input id="card-system" name="system" type="text" maxlength="60" placeholder="e.g. Billing, Auth, API" />
      </label>
      <label>
        Status
        <select id="card-status" name="status">
          <option value="open">open</option>
          <option value="planned">planned</option>
          <option value="in-progress">in-progress</option>
          <option value="reviewing">reviewing</option>
          <option value="done">done</option>
        </select>
      </label>
      <label>
        Frame (column)
        <select id="card-frame" name="frame"></select>
      </label>
      <label>
        Parent card (optional)
        <select id="card-parent">
          <option value="">— None —</option>
        </select>
      </label>
      <div id="card-id-field" class="modal-id-field" hidden>
        <span class="modal-id-label">Card ID</span>
        <div class="modal-id-row">
          <input id="card-id" type="text" class="modal-id-input" readonly />
          <button id="card-id-copy" class="btn modal-id-copy" type="button">Copy</button>
        </div>
      </div>
      <p id="card-dates" class="modal-dates" hidden></p>
      <div class="modal-actions">
        <button type="button" class="btn" data-close>Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>

  <script nonce="{{ theme_nonce }}">
    (function () {
      // Load saved theme
      var t = localStorage.getItem("kanban.theme") || "dark";
      document.documentElement.setAttribute("data-theme", t);

      // Theme selector — mirrors index.html behaviour.
      var sel = document.getElementById('theme-select');
      if (sel) {
        sel.value = t;
        sel.addEventListener('change', function () {
          localStorage.setItem('kanban.theme', this.value);
          document.documentElement.setAttribute('data-theme', this.value);
        });
      }
    })();

  </script>
  <script src="{{ url_for('static', filename='search.js') }}" defer></script>
  <script src="{{ url_for('static', filename='cardid.js') }}" defer></script>
  <script src="{{ url_for('static', filename='boardapi.js') }}" defer></script>
  <script src="{{ url_for('static', filename='treeview.js') }}" defer></script>
</body>
</html>
